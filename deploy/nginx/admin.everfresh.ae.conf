# admin.everfresh.ae - the Everfresh admin panel.
#
# This is the existing Certbot-generated vhost with ONE change: `location /`
# served the API by proxying to 10.10.0.30:5000, and now serves the panel's
# static files. The API moved to api.everfresh.ae on the IIS box and the panel
# calls it directly, so there is nothing left to proxy here. Everything else -
# server names, both server blocks, every Certbot line - is byte-for-byte as it
# was.
#
# Target: /etc/nginx/sites-available/admin.everfresh.ae on LXC 100.

server {
    server_name admin.everfresh.ae www.admin.everfresh.ae;

    # `live` is a symlink to a timestamped release, not a build directory.
    # Vite empties its output directory before writing, so building into the
    # served path would serve 404s for the length of every build. deploy.sh
    # builds a release, checks it, then moves this symlink once.
    # disable_symlinks off is what lets nginx follow it.
    root /var/www/everfresh-admin-ui/live;
    index index.html;
    disable_symlinks off;

    # Vite fingerprints every asset filename, so a changed file is a new URL.
    location /assets/ {
        # max-age here rather than `expires 1y`, which emits a second,
        # separate Cache-Control header alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        # index.html is the only file whose name never changes, and it is what
        # names the hashed assets. A cached copy after a deploy points at
        # filenames that no longer exist - a blank page that reloading does not
        # fix.
        add_header Cache-Control "no-store" always;

        # react-router uses BrowserRouter with no basename, so /app/dashboard
        # is a real URL with no file behind it. Hand over the shell and let the
        # router resolve the path.
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.everfresh.ae/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.everfresh.ae/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.admin.everfresh.ae) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = admin.everfresh.ae) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name admin.everfresh.ae www.admin.everfresh.ae;
    return 404; # managed by Certbot
}
