# admin.everfresh.ae - the Everfresh admin panel.
#
# Static files only. There is no proxy here and no upstream: the API lives at
# api.everfresh.ae on the Windows/IIS box and the panel calls it directly.
#
# Why a separate hostname is safe here, when it usually is not:
#
#   The panel keeps its refresh token in an httpOnly cookie and sends every
#   request with `credentials: 'include'`. That normally argues for serving the
#   API from this same hostname, because a cookie on a *third-party* site is
#   blocked outright by Safari and is being phased out by Chrome.
#
#   admin.everfresh.ae and api.everfresh.ae are not third-party to each other.
#   Browsers decide that by registrable domain, and both resolve to
#   everfresh.ae - so the request is same-site, merely cross-origin. The cookie
#   is first-party and no browser blocks it. Cross-origin only means CORS
#   applies, which the API already handles.
#
#   Two things on the backend have to hold for this, and both fail silently:
#     - COOKIE_DOMAIN must be `.everfresh.ae`. Anything narrower, such as
#       api.everfresh.ae, is rejected by a browser sitting on this hostname.
#     - ALLOWED_ORIGINS must contain `https://admin.everfresh.ae`, exact
#       scheme. The committed default lists the http:// form, which never
#       matches an https Origin.
#   See deploy/README.md.
#
# Consequence: VITE_API_BASE_URL must be the absolute https URL, not a relative
# path. scripts/deploy.sh fails the build if a relative base reaches the
# bundle, because with no proxy here a relative /api/v1 would resolve against
# admin.everfresh.ae and hit the SPA fallback - every API call would come back
# as index.html with a 200, which reads as "logged out" with nothing in the
# console to explain it.
#
# This REPLACES the Certbot-generated vhost whose `location /` proxied
# everything to the API on LXC 102. Both server names are preserved.
#
# Target: /etc/nginx/sites-available/admin.everfresh.ae on LXC 100 (10.10.0.10),
# nginx 1.18.0 (Ubuntu).

server {
    # No `http2` here, and that is on purpose. In nginx 1.18 http2 is a
    # listening-socket option, not a per-server one: setting it on this vhost
    # would turn HTTP/2 on for every other site sharing :443 on this box, and
    # there are seventeen of them. Not a change to make from inside the
    # Everfresh vhost.
    listen 443 ssl;
    server_name admin.everfresh.ae www.admin.everfresh.ae;

    # Exactly the paths the previous vhost used - verified present on the box.
    ssl_certificate /etc/letsencrypt/live/admin.everfresh.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.everfresh.ae/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A symlink, not the build directory. Vite empties its output directory
    # before writing, so pointing nginx straight at it means ~20 seconds of
    # 404s on every deploy. deploy.sh builds into a timestamped release and
    # moves this symlink once, atomically, after checking the artefact.
    root /var/www/everfresh-admin-ui/live;
    index index.html;

    # `root` resolves through the release symlink above.
    disable_symlinks off;

    access_log /var/log/nginx/admin.everfresh.ae.access.log;
    error_log  /var/log/nginx/admin.everfresh.ae.error.log;

    # ---- Response headers --------------------------------------------------
    # helmet sets these on API responses, but the API is no longer served from
    # here - nothing would set them on the panel's own HTML without this.
    # DENY rather than SAMEORIGIN: nothing legitimately frames an admin panel,
    # and framing it is the whole clickjacking attack.
    #
    # nginx inherits add_header only into blocks that declare none of their
    # own, so any location below that sets a header has to repeat these.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Static SPA --------------------------------------------------------
    # Vite fingerprints every asset filename, so a changed file is a new URL
    # and these can be cached permanently. No security headers repeated here:
    # this path serves only JS, CSS and images, which are not framed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached. It is the only file whose name does not
    # change, and it is what names the hashed assets - a cached copy after a
    # deploy points at filenames that no longer exist, which shows up as a
    # blank page that a reload does not fix.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }

    # The API used to answer on a bare /health here, and this hostname was its
    # only public address for a long time - an uptime monitor may still be
    # pointed at it. Without this block the request would fall through to
    # try_files and get the SPA shell back with a 200, which is the worst
    # possible answer for a health check: permanently green. The redirect sends
    # a stale monitor to the real endpoint instead of lying to it.
    # Safe to delete once nothing is pointed here.
    location = /health {
        return 301 https://api.everfresh.ae/health;
    }

    # react-router uses BrowserRouter with no basename, so deep links like
    # /app/dashboard are real URLs the server has no file for. Hand them the
    # shell and let the router resolve the path.
    #
    # try_files serves the fallback from inside this block rather than
    # re-matching locations, so `location = /index.html` above never runs for
    # these - the headers it sets are repeated here for the same reason.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}

# Port 80: kept byte-for-byte as Certbot wrote it. Renewal here uses the nginx
# plugin, which edits the running config rather than serving a webroot
# challenge, so a hand-written /.well-known/acme-challenge/ block is not needed
# and changing this block risks breaking renewal.
server {
    if ($host = www.admin.everfresh.ae) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = admin.everfresh.ae) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name admin.everfresh.ae www.admin.everfresh.ae;
    return 404; # managed by Certbot
}
